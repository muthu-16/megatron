name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup buildozer.spec
        run: |
          # Ensure hostpython and python versions match
          sed -i 's/requirements = python3,kivy,google-generativeai,pyjnius/requirements = hostpython3==3.11.5,python3==3.11.5,kivy==2.3.0,google-generativeai,pyjnius/' buildozer.spec

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megatron-apk
          path: bin/*.apk
