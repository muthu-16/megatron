name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Setup buildozer.spec
        run: |
          # Ensure hostpython and python versions match (fixing the Colab bug!)
          sed -i 's/requirements = python3,kivy,google-generativeai,pyjnius/requirements = hostpython3==3.11.5,python3==3.11.5,kivy==2.3.0,google-generativeai,pyjnius/' buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: megatron-apk
          path: bin/*.apk
